<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OUT MASTER" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#09090d" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>OUT MASTER v10</title>
  <style>
    :root{--bg:#09090d;--card:#15151d;--card2:#1f1f2b;--text:#f7f7fb;--muted:#a7a7b7;--accent:#ff3b3b;--good:#25d366;--warn:#ffd166;--bad:#ff4d6d;--line:#2b2b3a;--shadow:0 18px 60px rgba(0,0,0,.45)}
    *{box-sizing:border-box}
    html,body{height:100%;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;margin:0;background:radial-gradient(circle at top,#222236 0%,var(--bg) 55%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
    main{max-width:560px;margin:0 auto;min-height:100%;padding:12px;display:flex;flex-direction:column;gap:10px}
    header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 2px}
    h1{margin:0;letter-spacing:.08em;font-size:24px;line-height:1}.sub{color:var(--muted);font-size:12px;margin-top:4px}
    .pill{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);padding:8px 10px;border-radius:999px;font-size:12px;white-space:nowrap}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow)}
    .topGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:10px;min-height:64px}
    .stat .label{color:var(--muted);font-size:11px}.stat .value{font-size:22px;font-weight:800;margin-top:2px}
    .scoreWrap{text-align:center;padding:12px 6px 6px}.modeRow,.settingsRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    button{appearance:none;border:0;border-radius:18px;min-height:48px;padding:12px 14px;font-size:15px;font-weight:800;color:var(--text);background:var(--card2);box-shadow:0 8px 22px rgba(0,0,0,.24);cursor:pointer;touch-action:manipulation}
    button:active{transform:translateY(1px) scale(.99)}button.primary{background:linear-gradient(135deg,#ff3131,#9d1010)}button.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted)}button.active{outline:2px solid var(--accent);color:#fff}
    .score{font-size:74px;font-weight:950;letter-spacing:-.05em;line-height:.95;text-shadow:0 10px 30px rgba(255,59,59,.22)}
    .hint{color:var(--muted);font-size:13px;margin-top:8px;min-height:18px}.choices{display:grid;grid-template-columns:1fr;gap:10px}
    .choiceBtn{min-height:62px;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px}.choiceBtn .route{font-size:20px;letter-spacing:.02em}.choiceBtn .tag{color:var(--muted);font-size:12px;font-weight:700}
    .result{min-height:28px;font-size:18px;font-weight:900;text-align:center;color:var(--muted)}.result.ok{color:var(--good)}.result.bad{color:var(--bad)}.result.perfect{color:var(--warn)}
    .rankingList{display:flex;flex-direction:column;gap:8px;margin-top:10px}.rankItem{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:9px 10px;font-size:13px}.rankNo{color:var(--warn);font-weight:900}.rankName{font-weight:800}.rankMeta{color:var(--muted);font-size:12px;text-align:right}
    .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:20;opacity:0}.overlay.show{animation:popFade .9s ease-out forwards}.burst{text-align:center;padding:28px 30px;border-radius:30px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.68);box-shadow:0 22px 90px rgba(255,59,59,.35);backdrop-filter:blur(10px)}.burst .big{font-size:42px;font-weight:1000;letter-spacing:.04em;color:#fff}.burst .small{margin-top:8px;font-size:18px;font-weight:900;color:var(--warn)}
    @keyframes popFade{0%{opacity:0;transform:scale(.72)}12%{opacity:1;transform:scale(1.04)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}
    .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(0,0,0,.76);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:10px 14px;font-weight:800;font-size:13px;opacity:0;pointer-events:none;z-index:30}.toast.show{animation:toast .95s ease-out forwards}
    @keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,10px)}}
    @media(max-width:520px){main{padding:10px}h1{font-size:22px}.score{font-size:68px}.choiceBtn{min-height:66px}.burst .big{font-size:34px}}
  </style>
</head>
<body>
  <main>
    <header><div><h1>OUT MASTER</h1><div class="sub">Instant Checkout Trainer / Mobile v10</div></div><div class="pill" id="modeLabel">PRACTICE</div></header>
    <section class="card">
      <div class="topGrid">
        <div class="stat"><div class="label">TIME</div><div class="value" id="timeText">0.0s</div></div>
        <div class="stat"><div class="label">PERFECT STREAK</div><div class="value" id="streakText">0</div></div>
        <div class="stat"><div class="label">BEST</div><div class="value" id="bestText">--</div></div>
        <div class="stat"><div class="label">ACCURACY</div><div class="value" id="accuracyText">--%</div></div>
      </div>
      <div class="modeRow"><button class="ghost active" id="practiceBtn">練習</button><button class="ghost" id="taBtn">TA</button><button class="primary" id="startBtn">START</button></div>
      <div class="settingsRow"><button class="ghost" id="soundBtn">ミス音: ON</button><button class="ghost" id="rankingBtn">ランキング</button><button class="ghost" id="resetBtn">記録リセット</button></div>
    </section>
    <section class="card scoreWrap"><div class="score" id="scoreText">--</div><div class="hint" id="hintText">STARTで出題。王道ルートならPERFECT。</div></section>
    <section class="card"><div class="result" id="resultText">待機中</div><div class="choices" id="choices"></div></section>
    <section class="card" id="rankingCard" style="display:none;"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;"><strong>LOCAL RANKING</strong><span class="sub">TA TOP 10</span></div><div class="rankingList" id="rankingList"></div></section>
  </main>
  <div class="overlay" id="overlay"><div class="burst"><div class="big" id="overlayBig">PERFECT!!</div><div class="small" id="overlaySmall">王道ルートボーナス -0.5s!!</div></div></div>
  <div class="toast" id="toast">Saved</div>
  <script>
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    }

    const QUESTIONS=[
      {score:170,main:"T20 → T20 → Bull",alts:["T20 → T20 → Bull","T20 → T19 → T19","Bull → T20 → T20","NO OUT"]},
      {score:167,main:"T20 → T19 → Bull",alts:["T20 → T19 → Bull","T19 → T20 → Bull","T20 → T20 → T15","NO OUT"]},
      {score:164,main:"T20 → T18 → Bull",alts:["T20 → T18 → Bull","T19 → T19 → Bull","T20 → T20 → D22","NO OUT"]},
      {score:161,main:"T20 → T17 → Bull",alts:["T20 → T17 → Bull","T19 → T18 → Bull","T20 → T19 → D22","NO OUT"]},
      {score:160,main:"T20 → T20 → D20",alts:["T20 → T20 → D20","T19 → T19 → D23","Bull → T20 → Bull","NO OUT"]},
      {score:158,main:"T20 → T20 → D19",alts:["T20 → T20 → D19","T20 → T18 → D22","T19 → T17 → Bull","NO OUT"]},
      {score:156,main:"T20 → T20 → D18",alts:["T20 → T20 → D18","T20 → T18 → D21","T19 → T19 → D21","NO OUT"]},
      {score:154,main:"T20 → T18 → D20",alts:["T20 → T18 → D20","T19 → T19 → D20","T20 → T20 → D17","NO OUT"]},
      {score:152,main:"T20 → T20 → D16",alts:["T20 → T20 → D16","T20 → T18 → D19","T19 → T19 → D19","NO OUT"]},
      {score:150,main:"T20 → T18 → D18",alts:["T20 → T18 → D18","T20 → T20 → D15","T19 → T19 → D18","NO OUT"]},
      {score:148,main:"T20 → T16 → D20",alts:["T20 → T16 → D20","T20 → T20 → D14","T19 → T17 → D20","NO OUT"]},
      {score:141,main:"T20 → T19 → D12",alts:["T20 → T19 → D12","T20 → T15 → D18","T17 → T18 → D18","NO OUT"]},
      {score:132,main:"Bull → Bull → D16",alts:["Bull → Bull → D16","T20 → T16 → D12","T20 → T20 → D6","NO OUT"]},
      {score:120,main:"T20 → 20 → D20",alts:["T20 → 20 → D20","T20 → T20","Bull → Bull → D10","NO OUT"]},
      {score:100,main:"T20 → D20",alts:["T20 → D20","Bull → Bull","T19 → 3 → D20","NO OUT"]},
      {score:97,main:"T19 → D20",alts:["T19 → D20","T20 → 17 → D10","Bull → 7 → D20","NO OUT"]},
      {score:86,main:"T18 → D16",alts:["T18 → D16","T20 → D13","Bull → D18","NO OUT"]},
      {score:82,main:"Bull → D16",alts:["Bull → D16","T14 → D20","T18 → D14","NO OUT"]},
      {score:70,main:"T18 → D8",alts:["T18 → D8","T10 → D20","Bull → D10","NO OUT"]},
      {score:64,main:"T16 → D8",alts:["T16 → D8","T8 → D20","16 → 16 → D16","NO OUT"]},
      {score:50,main:"Bull",alts:["Bull","18 → D16","10 → D20","NO OUT"]},
      {score:40,main:"D20",alts:["D20","20 → D10","10 → D15","NO OUT"]},
      {score:32,main:"D16",alts:["D16","16 → D8","8 → D12","NO OUT"]},
      {score:2,main:"D1",alts:["D1","1 → 1","S2","NO OUT"]}
    ];

    const KEY="outMasterV10";
    const DEFAULT_STATE={bestTime:null,todayBestDate:null,todayBest:null,total:0,correct:0,bestPerfectStreak:0,sound:true,ranking:[]};
    let store=loadStore(),mode="practice",current=null,locked=true,startMs=0,timerId=null,elapsed=0,perfectStreak=0,sessionCorrect=0,sessionTotal=0,taLimit=10,taCount=0;
    const $=id=>document.getElementById(id);
    const scoreText=$("scoreText"),choices=$("choices"),resultText=$("resultText"),hintText=$("hintText"),timeText=$("timeText"),streakText=$("streakText"),bestText=$("bestText"),accuracyText=$("accuracyText"),modeLabel=$("modeLabel"),rankingCard=$("rankingCard"),rankingList=$("rankingList"),overlay=$("overlay"),overlayBig=$("overlayBig"),overlaySmall=$("overlaySmall"),toast=$("toast");

    function loadStore(){try{return {...DEFAULT_STATE,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch(e){return {...DEFAULT_STATE}}}
    function saveStore(){localStorage.setItem(KEY,JSON.stringify(store));renderStats();renderRanking()}
    function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
    function renderStats(){bestText.textContent=store.bestTime==null?"--":`${store.bestTime.toFixed(1)}s`;const acc=store.total?Math.round(store.correct/store.total*100):null;accuracyText.textContent=acc==null?"--%":`${acc}%`;streakText.textContent=perfectStreak;$("soundBtn").textContent=`ミス音: ${store.sound?"ON":"OFF"}`}
    function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}
    function pickQuestion(){return QUESTIONS[Math.floor(Math.random()*QUESTIONS.length)]}
    function newQuestion(){locked=false;current=pickQuestion();scoreText.textContent=current.score;hintText.textContent=mode==="ta"?`TA ${taCount+1}/${taLimit}：王道ルートなら -0.5s`:"正しい上がりルートを選べ。";resultText.textContent="選べ！";resultText.className="result";choices.innerHTML="";shuffle(current.alts).forEach(route=>{const btn=document.createElement("button");btn.className="choiceBtn";btn.innerHTML=`<span class="route">${route}</span><span class="tag">${route===current.main?"王道候補":""}</span>`;btn.addEventListener("click",()=>answer(route));choices.appendChild(btn)})}
    function answer(route){if(locked||!current)return;locked=true;const isCorrect=route===current.main;sessionTotal++;store.total++;if(isCorrect){sessionCorrect++;store.correct++;perfectStreak++;store.bestPerfectStreak=Math.max(store.bestPerfectStreak||0,perfectStreak);resultText.textContent="PERFECT!! 王道ルート！";resultText.className="result perfect";showOverlay("PERFECT!!","王道ルートボーナス -0.5s!!")}else{perfectStreak=0;resultText.textContent=`MISS... 正解: ${current.main}`;resultText.className="result bad";missSound()}saveStore();if(mode==="ta"){taCount++;if(taCount>=taLimit){setTimeout(finishTA,850);return}}setTimeout(newQuestion,isCorrect?880:1150)}
    function start(){sessionCorrect=0;sessionTotal=0;perfectStreak=0;taCount=0;elapsed=0;startMs=performance.now();clearInterval(timerId);timerId=setInterval(updateTimer,100);if(mode==="practice")timeText.textContent="FREE";newQuestion();renderStats()}
    function updateTimer(){if(mode!=="ta")return;const raw=(performance.now()-startMs)/1000;elapsed=Math.max(0,raw-sessionCorrect*.5);timeText.textContent=`${elapsed.toFixed(1)}s`}
    function finishTA(){clearInterval(timerId);locked=true;updateTimer();const finalTime=elapsed;scoreText.textContent="FIN";hintText.textContent=`TA終了：${sessionCorrect}/${sessionTotal} 正解`;resultText.textContent=`TIME ${finalTime.toFixed(1)}s`;resultText.className="result ok";if(store.bestTime==null||finalTime<store.bestTime)store.bestTime=finalTime;const t=today();if(store.todayBestDate!==t){store.todayBestDate=t;store.todayBest=null}if(store.todayBest==null||finalTime<store.todayBest)store.todayBest=finalTime;const name=prompt("ランキング登録名",localStorage.getItem("outMasterName")||"HOKUTO")||"NO NAME";localStorage.setItem("outMasterName",name);store.ranking.push({name:name.slice(0,12),time:Number(finalTime.toFixed(1)),perfect:sessionCorrect,date:t});store.ranking.sort((a,b)=>a.time-b.time||b.perfect-a.perfect);store.ranking=store.ranking.slice(0,10);saveStore();rankingCard.style.display="block";showToast("ランキング登録したぜ")}
    function setMode(next){mode=next;modeLabel.textContent=next==="ta"?"TIME ATTACK":"PRACTICE";$("practiceBtn").classList.toggle("active",next==="practice");$("taBtn").classList.toggle("active",next==="ta");timeText.textContent=next==="ta"?"0.0s":"FREE";showToast(next==="ta"?"TAモード":"練習モード")}
    function showOverlay(big,small){overlayBig.textContent=big;overlaySmall.textContent=small;overlay.classList.remove("show");void overlay.offsetWidth;overlay.classList.add("show")}
    function showToast(msg){toast.textContent=msg;toast.classList.remove("show");void toast.offsetWidth;toast.classList.add("show")}
    function missSound(){if(!store.sound)return;try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator();const gain=ctx.createGain();osc.type="sawtooth";osc.frequency.value=150;gain.gain.setValueAtTime(.12,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.16);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.16)}catch(e){}}
    function renderRanking(){rankingList.innerHTML="";if(!store.ranking.length){rankingList.innerHTML=`<div class="sub">まだ記録なし。TAやろうぜ。</div>`;return}store.ranking.forEach((r,i)=>{const div=document.createElement("div");div.className="rankItem";div.innerHTML=`<div class="rankNo">#${i+1}</div><div class="rankName">${escapeHtml(r.name)}</div><div class="rankMeta">${r.time.toFixed(1)}s<br>PERFECT ${r.perfect}</div>`;rankingList.appendChild(div)})}
    function escapeHtml(str){return String(str).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]))}
    $("practiceBtn").addEventListener("click",()=>setMode("practice"));
    $("taBtn").addEventListener("click",()=>setMode("ta"));
    $("startBtn").addEventListener("click",start);
    $("soundBtn").addEventListener("click",()=>{store.sound=!store.sound;saveStore();showToast(`ミス音 ${store.sound?"ON":"OFF"}`)});
    $("rankingBtn").addEventListener("click",()=>{rankingCard.style.display=rankingCard.style.display==="none"?"block":"none";renderRanking()});
    $("resetBtn").addEventListener("click",()=>{if(!confirm("ローカル記録をリセットする？"))return;store={...DEFAULT_STATE,sound:store.sound};perfectStreak=0;saveStore();showToast("記録リセット完了")});
    setMode("practice");renderStats();renderRanking();
  </script>
</body>
</html>
