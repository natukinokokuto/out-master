<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="OUT MASTER" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>OUT MASTER v10.13.5</title>
  <link rel="manifest" href="./manifest.json?v=10.13.5" />
  <link rel="stylesheet" href="./styles.css?v=10.13.5" />
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div>
        <h1>OUT MASTER</h1>
        <p id="versionLabel">v10.13.5</p>
      </div>
      <button id="settingsBtn" class="icon-btn" type="button">⚙︎</button>
    </header>

    <main>
      <section id="homeScreen" class="screen active">
        <div class="mode-row">
          <button class="mode-btn active" data-mode="button" type="button">BUTTON</button>
          <button class="mode-btn" data-mode="flick" type="button">FLICK</button>
          <button class="mode-btn" data-mode="classic" type="button">CLASSIC</button>
        </div>

        <div class="score-card">
          <div class="score-label">SCORE</div>
          <div id="score" class="score">0</div>
          <div id="message" class="message">Tap a target!</div>
        </div>

        <div class="target-grid">
          <button class="target single" data-hit="single" type="button">SINGLE</button>
          <button class="target double" data-hit="double" type="button">DOUBLE</button>
          <button class="target triple" data-hit="triple" type="button">TRIPLE</button>
          <button class="target bull" data-hit="bull" type="button">BULL</button>
          <button class="target good" data-hit="good" type="button">GOOD</button>
          <button class="target perfect" data-hit="perfect" type="button">PERFECT</button>
          <button class="target miss" data-hit="miss" type="button">MISS</button>
          <button id="resetBtn" class="target reset" type="button">RESET</button>
        </div>
      </section>

      <section id="settingsScreen" class="screen" aria-hidden="true">
        <div class="settings-card">
          <h2>SETTINGS</h2>
          <label>BGM volume <input id="bgmVolume" type="range" min="0" max="1" step="0.01" value="0.35"></label>
          <label>SE volume <input id="seVolume" type="range" min="0" max="1" step="0.01" value="0.8"></label>
          <button id="bgmToggle" class="wide-btn" type="button">BGM ON / OFF</button>
          <button id="clearCacheBtn" class="wide-btn danger" type="button">Clear PWA cache</button>
          <button id="closeSettingsBtn" class="wide-btn" type="button">Back</button>
        </div>
      </section>
    </main>
  </div>

  <audio id="bgm" preload="auto" loop src="./audio/bgm.mp3?v=10.13.5"></audio>
  <audio id="seSingle" preload="auto" src="./audio/single.mp3?v=10.13.5"></audio>
  <audio id="seDouble" preload="auto" src="./audio/double.mp3?v=10.13.5"></audio>
  <audio id="seTriple" preload="auto" src="./audio/triple.mp3?v=10.13.5"></audio>
  <audio id="seBull" preload="auto" src="./audio/bull.mp3?v=10.13.5"></audio>
  <audio id="seGood" preload="auto" src="./audio/good.mp3?v=10.13.5"></audio>
  <audio id="sePerfect" preload="auto" src="./audio/perfect.mp3?v=10.13.5"></audio>
  <audio id="seMiss" preload="auto" src="./audio/miss.mp3?v=10.13.5"></audio>

  <script src="./app.js?v=10.13.5" defer></script>
</body>
</html>
