<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101014">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>OUT MASTER v10.10.3</title>
<!-- v10.8.2 bull hardfix: green bull and red bull both return BULL=50 -->
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#09090d;
  color:#fff;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;
  user-select:none;
}
button{font-family:inherit;touch-action:manipulation}
.screen{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.36s ease;
}
.hide{
  opacity:0;
  pointer-events:none;
  transform:scale(1.02);
}
.bgOnly{
  position:absolute;
  inset:0;
  background:
    linear-gradient(180deg, rgba(0,0,0,.02), rgba(0,0,0,.24)),
    url("./assets/menu-bg.jpg") center/cover no-repeat;
}
.tapHint{
  position:absolute;
  left:50%;
  bottom:calc(28px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:2;
  padding:10px 16px;
  border:1px solid rgba(255,176,32,.35);
  border-radius:999px;
  background:rgba(0,0,0,.22);
  color:#ffb020;
  font-size:11px;
  letter-spacing:.24em;
  font-weight:900;
  animation:blink 1.3s infinite;
  backdrop-filter:blur(6px);
}
@keyframes blink{50%{opacity:.35}}

.menuOverlay{
  position:absolute;
  inset:0;
  background:
    linear-gradient(180deg, rgba(0,0,0,.16), rgba(0,0,0,.70)),
    url("./assets/menu-bg.jpg") center/cover no-repeat;
}
.menuOverlay::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at center, rgba(0,0,0,.02), rgba(0,0,0,.54) 78%);
}
.menuPanel{
  position:relative;
  z-index:2;
  width:min(92vw,430px);
  display:flex;
  flex-direction:column;
  gap:13px;
  margin-top:clamp(120px, 22vh, 230px);
}
.logo{
  text-align:center;
  margin-bottom:20px;
  text-shadow:0 0 24px rgba(255,140,0,.8);
}
.logo .out{
  font-size:clamp(54px,16vw,100px);
  font-weight:1000;
  line-height:.88;
  color:#ff9d00;
}
.logo .master{
  font-size:clamp(50px,14vw,90px);
  font-weight:1000;
  line-height:.9;
  color:#fff3e4;
}
.menuBtn{
  position:relative;
  border:1px solid rgba(255,255,255,.42);
  background:rgba(12,12,16,.62);
  color:#fff4e8;
  backdrop-filter:blur(6px);
  border-radius:18px;
  min-height:74px;
  padding:14px 18px 14px 82px;
  text-align:left;
  box-shadow:0 12px 36px rgba(0,0,0,.35), inset 0 0 18px rgba(255,255,255,.03);
}
.menuBtn:active{transform:translateY(1px) scale(.99)}
.menuBtn.primary{
  border-color:rgba(255,176,32,.9);
  background:linear-gradient(180deg, rgba(255,153,0,.42), rgba(80,34,0,.62));
  box-shadow:0 0 28px rgba(255,153,0,.35), 0 14px 42px rgba(0,0,0,.45);
}
.menuIcon{
  position:absolute;
  left:20px;
  top:50%;
  transform:translateY(-50%);
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}
.menuTitle{
  display:block;
  font-size:26px;
  line-height:1;
  font-weight:1000;
  letter-spacing:.03em;
}
.menuSub{
  display:block;
  margin-top:7px;
  font-size:12px;
  color:#d8c3aa;
  font-weight:700;
}
.versionTiny{
  position:absolute;
  right:14px;
  bottom:calc(8px + env(safe-area-inset-bottom));
  z-index:3;
  color:rgba(255,255,255,.52);
  font-size:10px;
  letter-spacing:.12em;
  font-weight:800;
  text-shadow:0 1px 4px rgba(0,0,0,.9);
}

.boardScreen{
  background:#101014;
  justify-content:flex-start;
  padding:8px;
  overflow:hidden;
}
.boardShell{
  height:100dvh;
  width:100%;
  max-width:560px;
  display:grid;
  grid-template-rows:auto auto 1fr;
  gap:7px;
}
.card{
  background:#1b1b22;
  border:1px solid #30303a;
  border-radius:16px;
  padding:8px;
  width:100%;
  min-height:0;
}
.top{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;
}
.infoLabel{color:#aaa;font-size:10px;text-align:center}
.infoValue{font-size:14px;font-weight:900;text-align:center;margin-top:2px}
.score{
  font-size:50px;
  font-weight:1000;
  text-align:center;
  color:#ffb020;
  line-height:.95;
}
.score.bad{color:#ef4444}
.status{
  min-height:22px;
  text-align:center;
  font-size:13px;
  font-weight:900;
  margin-top:4px;
}
.good{color:#22c55e}.bad{color:#ef4444}
.boardWrap{
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
}
svg{
  width:min(94vw, min(520px, 58dvh));
  max-height:58dvh;
  height:auto;
  display:block;
  overflow:visible;
}
.seg{cursor:pointer;stroke:#111;stroke-width:.55}
.black{fill:#242424}.white{fill:#ececec}.red{fill:#d84835}.green{fill:#2e8b57}
.label{
  font-size:10px;
  fill:#f5f5f5;
  text-anchor:middle;
  dominant-baseline:middle;
  font-weight:900;
  pointer-events:none;
}
.noout{
  width:78px;
  height:78px;
  border-radius:50%;
  border:5px solid #5a0f0f;
  background:radial-gradient(circle at 30% 30%, #ff6b6b, #c62828 70%);
  color:#fff;
  font-size:12px;
  font-weight:900;
  box-shadow:0 10px 24px rgba(0,0,0,.5);
}
.miniTop{display:flex;gap:7px;margin-bottom:7px}
.miniTop button{
  flex:1;
  border:0;
  border-radius:12px;
  padding:9px 8px;
  background:#2d2d36;
  color:white;
  font-weight:900;
  font-size:12px;
}
.miniTop .primary{background:#ffb020;color:#1a1200}
.perfectOverlay{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  opacity:0;
  z-index:9999;
}
.perfectOverlay.show{animation:perfectPop .9s ease-out forwards}
.perfectBox{
  text-align:center;
  padding:22px 26px;
  border-radius:28px;
  background:rgba(0,0,0,.78);
  border:1px solid rgba(255,176,32,.45);
  box-shadow:0 0 48px rgba(255,176,32,.35);
}
.perfectBig{font-size:38px;font-weight:1000;color:#ffb020}
.perfectSmall{margin-top:7px;font-size:16px;font-weight:900}
.resultCard{
  position:fixed;
  inset:env(safe-area-inset-top) 8px env(safe-area-inset-bottom) 8px;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(8px);
}
.resultInner{
  width:min(92vw,420px);
  background:#1b1b22;
  border:1px solid #444451;
  border-radius:22px;
  padding:18px;
  box-shadow:0 18px 70px rgba(0,0,0,.55);
  text-align:center;
}
.bigResult{
  font-size:34px;
  font-weight:950;
  color:#ffb020;
  margin:8px 0;
}
@keyframes perfectPop{
  0%{opacity:0;transform:scale(.7)}
  12%{opacity:1;transform:scale(1.08)}
  70%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.1)}
}
@media(max-height:760px){
  .menuPanel{margin-top:112px}
  .menuBtn{min-height:64px}
  .menuTitle{font-size:23px}
  .logo{display:none}
}
@media(max-width:390px){
  .menuPanel{margin-top:118px}
  .menuTitle{font-size:23px}
  .menuBtn{padding-left:72px}
  .menuIcon{left:18px}
}

.keyActive{
  outline:3px solid #ffb020!important;
  box-shadow:0 0 22px rgba(255,176,32,.55)!important;
  transform:translateY(1px) scale(.97);
}


.inputGuide{
  min-height:22px;
  text-align:center;
  color:#d8c3aa;
  font-size:12px;
  font-weight:900;
  letter-spacing:.04em;
  margin-top:2px;
}
.holdActive{
  outline:3px solid #ffb020!important;
  box-shadow:0 0 24px rgba(255,176,32,.65), 0 10px 24px rgba(0,0,0,.45)!important;
  transform:translateY(1px) scale(.96);
}

</style>
</head>
<body>
<div id="titleScreen" class="screen">
  <div class="bgOnly"></div>
  <div class="tapHint">TAP TO START</div>
</div>

<div id="menuScreen" class="screen hide">
  <div class="menuOverlay"></div>
  <div class="menuPanel">
    <div class="logo">
      <div class="out">OUT</div>
      <div class="master">MASTER</div>
    </div>
    <button class="menuBtn primary" onclick="startTA()">
      <span class="menuIcon">⏱</span>
      <span class="menuTitle">TIME ATTACK</span>
      <span class="menuSub">最後の3本を脳に刻め</span>
    </button>
    <button class="menuBtn" onclick="startPractice()">
      <span class="menuIcon">🎯</span>
      <span class="menuTitle">PRACTICE</span>
      <span class="menuSub">じっくりルート練習</span>
    </button>
    <button class="menuBtn" onclick="showRanking()">
      <span class="menuIcon">🏆</span>
      <span class="menuTitle">RANKING</span>
      <span class="menuSub">端末内のベスト記録</span>
    </button>
    <button class="menuBtn" onclick="openSettings()">
      <span class="menuIcon">⚙</span>
      <span class="menuTitle">SETTINGS</span>
      <span class="menuSub">入力モード・サウンド設定</span>
    </button>
  </div>
  <div class="versionTiny">v10.10.3</div>
</div>


<div id="settingsScreen" class="screen hide">
  <div class="menuOverlay"></div>
  <div class="menuPanel">
    <div class="logo" style="margin-bottom:12px">
      <div class="master" style="font-size:48px">SETTINGS</div>
    </div>

    <div class="menuBtn" style="padding:18px">
      <div class="menuTitle" style="font-size:20px">INPUT MODE</div>
      <div class="menuSub" style="margin-top:12px">CLASSIC / BUTTON / FLICK</div>

      <div style="display:flex;gap:8px;margin-top:16px">
        <button id="classicModeBtn" onclick="setInputMode('CLASSIC')" style="flex:1;padding:12px;border-radius:12px;border:0;font-weight:900">CLASSIC</button>
        <button id="buttonModeBtn" onclick="setInputMode('BUTTON')" style="flex:1;padding:12px;border-radius:12px;border:0;font-weight:900">BUTTON</button>
        <button id="flickModeBtn" onclick="setInputMode('FLICK')" style="flex:1;padding:12px;border-radius:12px;border:0;font-weight:900">FLICK</button>
      </div>

      <div id="modeExplain" style="margin-top:14px;font-size:12px;color:#d8c3aa;line-height:1.6">
      </div>
    </div>

    <div class="menuBtn" style="padding:18px">
      <div class="menuTitle" style="font-size:20px">SOUND</div>

      <div style="display:flex;gap:8px;margin-top:16px">
        <button onclick="toggleSound()" id="settingsSoundBtn" style="flex:1;padding:12px;border-radius:12px;border:0;font-weight:900">
          SOUND ON
        </button>
      </div>
    </div>

    <button class="menuBtn primary" onclick="closeSettings()">
      <span class="menuTitle">BACK</span>
    </button>
  </div>
</div>

<div id="boardScreen" class="screen boardScreen hide">
  <div class="boardShell">
    <div class="miniTop">
      <button onclick="backToMenu()">MENU</button>
      <button class="primary" onclick="startTA()">RESTART</button>
      <button onclick="toggleSound()" id="soundBtn">音 ON</button>
    </div>
    <div class="card">
      <div class="top">
        <div><div class="infoLabel">ROUND</div><div class="infoValue" id="round">- / 8</div></div>
        <div><div class="infoLabel">TIME</div><div class="infoValue"><span id="timer">0.00</span>s</div></div>
        <div><div class="infoLabel">MISS</div><div class="infoValue" id="miss">0</div></div>
      </div>
      <div style="text-align:center;color:#aaa;font-size:12px;margin-top:4px">残り点</div>
      <div class="score" id="score">---</div>
      <div id="status" class="status"></div>
    </div>
    <div class="card boardWrap">
      <svg id="board" viewBox="-120 -120 240 240" aria-label="dart board"></svg>
      <div class="inputGuide" id="inputGuide">CLASSIC: 盤面そのまま</div>
      <div style="display:flex;align-items:center;gap:12px">
<button id="tripleBtn" class="noout" style="width:66px;height:66px;background:radial-gradient(circle at 30% 30%, #8b5cf6, #4c1d95 70%);border-color:#2e1065;font-size:20px">T</button>

<button class="noout" onclick="answerNoOut()">上がれない</button>

<button id="doubleBtn" class="noout" style="width:66px;height:66px;background:radial-gradient(circle at 30% 30%, #22c55e, #166534 70%);border-color:#14532d;font-size:20px">D</button>
</div>
    </div>
  </div>
</div>

<div class="resultCard hide" id="resultCard">
  <div class="resultInner">
    <div style="color:#aaa">RESULT</div>
    <div class="bigResult" id="finalScore"></div>
    <div id="detail" style="color:#ccc;font-size:13px;line-height:1.5"></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="menuBtn primary" style="min-height:auto;padding:12px;text-align:center" onclick="startTA()">もう一回</button>
      <button class="menuBtn" style="min-height:auto;padding:12px;text-align:center" onclick="backToMenu()">MENU</button>
    </div>
  </div>
</div>

<div class="perfectOverlay" id="perfectOverlay">
  <div class="perfectBox">
    <div class="perfectBig" id="perfectBig">PERFECT!!</div>
    <div class="perfectSmall" id="perfectSmall">王道ルートボーナス -0.5s!!</div>
  </div>
</div>

<script>
const nums = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const all = [];
for(let n=1;n<=20;n++){
  all.push({name:String(n),score:n,kind:"S"});
  all.push({name:"D"+n,score:n*2,kind:"D"});
  all.push({name:"T"+n,score:n*3,kind:"T"});
}
all.push({name:"BULL",score:50,kind:"B"});

const STORE_KEY = "outMasterBoardV10103";
let store = loadStore();

let playing=false, practiceMode=false, current=0, displayRem=0, round=0, miss=0, startTime=0, timerId=null, answerRoutes=[];
let bonusTime = 0;
let selectedThrows=[];

let heldMode=null;
let flickStart=null;

function updateHoldVisual(){
  const t=document.getElementById("tripleBtn");
  const d=document.getElementById("doubleBtn");
  if(t)t.classList.toggle("holdActive", heldMode==="T");
  if(d)d.classList.toggle("holdActive", heldMode==="D");
}

function modePress(mode){
  if(store.inputMode!=="BUTTON") return;
  heldMode=mode;
  playSE("button");
  updateHoldVisual();
}

function modeRelease(){
  heldMode=null;
  updateHoldVisual();
}

function installHoldButtons(){
  const t=document.getElementById("tripleBtn");
  const d=document.getElementById("doubleBtn");

  const bind=(el,mode)=>{
    if(!el)return;

    const down=(e)=>{
      if(store.inputMode!=="BUTTON")return;
      e.preventDefault();
      e.stopPropagation();
      modePress(mode);
    };

    const up=(e)=>{
      if(store.inputMode!=="BUTTON")return;
      e.preventDefault();
      e.stopPropagation();
      modeRelease();
    };

    el.addEventListener("touchstart", down, {passive:false});
    el.addEventListener("touchend", up, {passive:false});
    el.addEventListener("touchcancel", up, {passive:false});
    el.addEventListener("pointerdown", down);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
    el.addEventListener("mousedown", down);
    el.addEventListener("mouseup", up);
    el.addEventListener("mouseleave", up);
  };

  bind(t,"T");
  bind(d,"D");
}

function updateInputGuide(){
  const guide=document.getElementById("inputGuide");
  if(!guide)return;
  if(store.inputMode==="CLASSIC") guide.textContent="CLASSIC: 盤面そのまま";
  if(store.inputMode==="BUTTON") guide.textContent="BUTTON: T/Dを押しながら数字";
  if(store.inputMode==="FLICK") guide.textContent="↑ T   /   TAP S   /   ↓ D";
}

function baseNumber(name){
  if(name==="BULL" || name==="SBULL") return "BULL";
  return String(name).replace("D","").replace("T","");
}

function applyMultiplier(name,multi){
  const num=baseNumber(name);
  if(num==="BULL") return "BULL";
  if(multi==="T") return "T"+num;
  if(multi==="D") return "D"+num;
  return String(num);
}

function boardPointerDown(e,name){
  flickStart={x:e.clientX,y:e.clientY,name};
}

function boardPointerUp(e,name){
  if(store.inputMode==="FLICK" && flickStart){
    const dy=e.clientY-flickStart.y;
    flickStart=null;
    if(dy < -26){ tap(applyMultiplier(name,"T")); return; }
    if(dy > 26){ tap(applyMultiplier(name,"D")); return; }
    tap(applyMultiplier(name,"S"));
    return;
  }

  if(store.inputMode==="BUTTON"){
    tap(applyMultiplier(name, heldMode || "S"));
    return;
  }

  tap(name);
}


function loadStore(){
  try{return Object.assign({sound:true,inputMode:"CLASSIC",best:null,ranking:[]}, JSON.parse(localStorage.getItem(STORE_KEY)||"{}"))}
  catch(e){return {sound:true,best:null,ranking:[]}}
}
function saveStore(){localStorage.setItem(STORE_KEY, JSON.stringify(store))}
function transition(from,to){
  document.getElementById(from).classList.add("hide");
  setTimeout(()=>document.getElementById(to).classList.remove("hide"),240);
}
document.getElementById("titleScreen").addEventListener("click",()=>transition("titleScreen","menuScreen"));





function openSettings(){
  const menu=document.getElementById("menuScreen");
  const settings=document.getElementById("settingsScreen");
  if(menu) menu.classList.add("hide");
  if(settings) settings.classList.remove("hide");
  updateInputGuide();
  if(typeof refreshModeUI==="function") refreshModeUI();
}

function closeSettings(){
  const menu=document.getElementById("menuScreen");
  const settings=document.getElementById("settingsScreen");
  if(settings) settings.classList.add("hide");
  if(menu) menu.classList.remove("hide");
}

function setInputMode(mode){
  store.inputMode=mode;
  saveStore();
  refreshModeUI();
  updateInputGuide();
}

function refreshModeUI(){
  updateInputGuide();
  const modes=["CLASSIC","BUTTON","FLICK"];

  modes.forEach(m=>{
    const id = m.toLowerCase()+"ModeBtn";
    const btn=document.getElementById(id);
    if(!btn)return;

    if(store.inputMode===m){
      btn.style.background="#ffb020";
      btn.style.color="#1a1200";
    }else{
      btn.style.background="#2d2d36";
      btn.style.color="#fff";
    }
  });

  const explain=document.getElementById("modeExplain");

  if(store.inputMode==="CLASSIC"){
    explain.innerHTML=
    "リアル盤面入力<br>T/Dリングを直接タップ";
  }

  if(store.inputMode==="BUTTON"){
    explain.innerHTML=
    "T/Dボタンを押しながら数字入力<br>普通タップは全てシングル";
  }

  if(store.inputMode==="FLICK"){
    explain.innerHTML=
    "タップ=S<br>上フリック=T<br>下フリック=D";
  }
}


function playSE(type){
  if(!store.sound) return;
  const map = {
    button:"seButton",
    single:"seSingle",
    triple:"seTriple",
    double:"seDouble",
    bull:"seBull",
    perfect:"sePerfect",
    miss:"seMiss"
  };
  const el=document.getElementById(map[type]);
  if(!el) return;
  try{
    el.currentTime=0;
    el.play();
  }catch(e){}
}

function toggleSound(){
  store.sound=!store.sound; saveStore(); updateSoundText();
}
function updateSoundText(){
  const sbtn=document.getElementById("settingsSoundBtn");
  if(sbtn){
    sbtn.textContent = store.sound ? "SOUND ON" : "SOUND OFF";
    sbtn.style.background = store.sound ? "#ffb020" : "#2d2d36";
    sbtn.style.color = store.sound ? "#1a1200" : "#fff";
  }

  const text="音 " + (store.sound?"ON":"OFF");
  const b=document.getElementById("soundBtn"); if(b)b.textContent=text;
  const m=document.getElementById("soundMenuText"); if(m)m.textContent="SOUND " + (store.sound?"ON":"OFF");
}
function missSound(){
  if(!store.sound)return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type="sawtooth"; osc.frequency.value=145;
    gain.gain.setValueAtTime(.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+.18);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+.18);
  }catch(e){}
}
function showPerfect(big,small){
  const o=document.getElementById("perfectOverlay");
  document.getElementById("perfectBig").textContent=big;
  document.getElementById("perfectSmall").textContent=small;
  o.classList.remove("show"); void o.offsetWidth; o.classList.add("show");
}
function startTA(){practiceMode=false; startGame();}
function startPractice(){practiceMode=true; startGame();}
function startGame(){
  document.getElementById("titleScreen").classList.add("hide");
  document.getElementById("menuScreen").classList.add("hide");
  document.getElementById("resultCard").classList.add("hide");
  document.getElementById("boardScreen").classList.remove("hide");
  playing=!practiceMode; round=1; miss=0; bonusTime=0; selectedThrows=[];
  document.getElementById("miss").textContent=miss;
  startTime=performance.now();
  clearInterval(timerId);
  if(!practiceMode){
    timerId=setInterval(()=>document.getElementById("timer").textContent=((performance.now()-startTime)/1000).toFixed(2),50);
  }else{
    document.getElementById("timer").textContent="FREE";
  }
  setQuestion();
}
function backToMenu(){
  clearInterval(timerId);
  document.getElementById("resultCard").classList.add("hide");
  document.getElementById("boardScreen").classList.add("hide");
  setTimeout(()=>document.getElementById("menuScreen").classList.remove("hide"),220);
}
function showRanking(){
  const rows = store.ranking.length
    ? store.ranking.map((r,i)=>`${i+1}. ${r.name} / ${Number(r.time).toFixed(2)}秒 / MISS ${r.miss}`).join("\\n")
    : "まだ記録なし";
  alert(rows);
}
function today(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function registerRanking(final, raw){
  if(practiceMode)return;
  if(store.best===null || final < store.best) store.best=final;
  const name=prompt("ランキング登録名", localStorage.getItem("outMasterName") || "HOKUTO") || "NO NAME";
  localStorage.setItem("outMasterName", name);
  store.ranking.push({name:name.slice(0,12), time:Number(final.toFixed(2)), raw:Number(raw.toFixed(2)), miss, bonus:Number(bonusTime.toFixed(1)), date:today()});
  store.ranking.sort((a,b)=>a.time-b.time || a.miss-b.miss);
  store.ranking=store.ranking.slice(0,10);
  saveStore();
}
function polar(r,a){return [r*Math.cos(a), r*Math.sin(a)]}
function wedgePath(r1,r2,a1,a2){
  const [x1,y1]=polar(r2,a1),[x2,y2]=polar(r2,a2),[x3,y3]=polar(r1,a2),[x4,y4]=polar(r1,a1);
  return `M ${x1} ${y1} A ${r2} ${r2} 0 0 1 ${x2} ${y2} L ${x3} ${y3} A ${r1} ${r1} 0 0 0 ${x4} ${y4} Z`;
}
function addWedge(svg,r1,r2,a1,a2,cls,name){
  const p=document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d",wedgePath(r1,r2,a1,a2));
  p.setAttribute("class","seg "+cls);
  p.onpointerdown=(e)=>boardPointerDown(e,name);
  p.onpointerup=(e)=>boardPointerUp(e,name);
  svg.appendChild(p);
}
function addCircle(svg,r,cls,name){
  const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
  c.setAttribute("cx",0); c.setAttribute("cy",0); c.setAttribute("r",r);
  c.setAttribute("class","seg "+cls);
  c.onpointerdown=(e)=>boardPointerDown(e,name);
  c.onpointerup=(e)=>boardPointerUp(e,name);
  svg.appendChild(c);
}
function drawBoard(){
  const svg=document.getElementById("board");
  svg.innerHTML="";
  const start=-Math.PI/2 - Math.PI/20;
  for(let i=0;i<20;i++){
    const n=nums[i], a1=start+i*Math.PI/10, a2=start+(i+1)*Math.PI/10;
    const base=(i%2===0)?"black":"white";
    const ring=(i%2===0)?"red":"green";
    addWedge(svg,76,100,a1,a2,ring,"D"+n);
    addWedge(svg,54,76,a1,a2,base,String(n));
    addWedge(svg,34,56,a1,a2,ring,"T"+n);
    addWedge(svg,11,36,a1,a2,base,String(n));
    const mid=(a1+a2)/2,[lx,ly]=polar(110,mid);
    const t=document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",lx); t.setAttribute("y",ly); t.setAttribute("class","label"); t.textContent=n;
    svg.appendChild(t);
  }
  addCircle(svg,11,"green","BULL");
  addCircle(svg,5.8,"red","BULL");
}
function isFinish(t){return t.kind==="D" || t.kind==="T" || t.kind==="B"}
function findRoutes(score,darts=3){
  const res=[];
  function dfs(rem,left,path){
    if(left===0){if(rem===0)res.push(path);return}
    for(const t of all){
      
      if(t.score>rem)continue;
      const next=rem-t.score;
      if(next===1)continue;
      if(left===1 && !isFinish(t))continue;
      dfs(next,left-1,path.concat(t));
      if(res.length>300)return;
    }
  }
  dfs(score,darts,[]);
  return res;
}
function chooseScore(){
  const hot=[170,167,164,161,160,158,157,156,155,154,153,152,151,150,149,148,147,146,145,144,143,142,141,140,139,138,137,136,135,134,133,132,131,130,129,128,127,126,125,124,123,122,121,120,119,118,117,116,115,114,113,112,111,110,109,108,107,106,105,104,103,102,101,100,99,98,97,96,95,94,93,92,91,90,89,88,87,86,85,84,83,82,81,80,79,78,77,76,75,74,73,72,71,70,69,68,67,66,65,64,63,62,61,60,59,58,57,56,55,54,53,52,51,50,49,48,47,46,45,44,43,42,41,40,39,38,37,36,35,34,33,32,31,30,29,28,27,26,25,24,23,22,21,20,19,18,17,16,15,14,13,12,11,10,9,8,7,6,5,4,3,2,169,168,166,165,163,162,159];
  return hot[Math.floor(Math.random()*hot.length)];
}
function setQuestion(){
  current=chooseScore();
  displayRem=current;
  answerRoutes=findRoutes(current,3);
  updateScoreDisplay();
  document.getElementById("round").textContent=practiceMode ? `P ${round}` : `${round}/8`;
  document.getElementById("status").textContent="";
  selectedThrows=[];
}
function updateScoreDisplay(extraClass=""){
  const el=document.getElementById("score");
  el.textContent=displayRem;
  el.className="score " + extraClass;
}
const popularRoutes={
  170:["T20","T20","BULL"],167:["T20","T19","BULL"],164:["T20","T18","BULL"],161:["T20","T17","BULL"],
  160:["T20","T20","D20"],158:["T20","T20","D19"],157:["T20","T19","D20"],156:["T20","T20","D18"],
  155:["T20","T19","D19"],154:["T20","T18","D20"],121:["T20","11","BULL"],100:["T20","D20"],
  81:["T19","D12"],72:["16","D20"],68:["T20","D4"],40:["D20"]
};
function isPopularRoute(names){
  const r=popularRoutes[current]; if(!r)return false;
  return r.join("|")===names.join("|");
}
function throwByName(name){
  if(name==="SBULL") return {name:"BULL",score:50,kind:"B"};
  if(name==="BULL") return {name:"BULL",score:50,kind:"B"};
  return all.find(t=>t.name===name);
}
function judgeSelectedRoute(names){
  let rem=current;
  for(const name of names){
    const t=throwByName(name); if(!t)return false;
    rem-=t.score;
    if(rem<0)return false;
    if(rem===1)return false;
    if(rem===0)return isFinish(t);
  }
  return false;
}
function calcRemaining(names){
  let rem=current;
  for(const name of names){
    const t=throwByName(name); if(!t)return current;
    rem-=t.score;
  }
  return rem;
}
function tap(name){
if(!current)return;

  if(name==="BULL") playSE("bull");
  else if(name.startsWith("T")) playSE("triple");
  else if(name.startsWith("D")) playSE("double");
  else playSE("single");

  selectedThrows.push(name);
  displayRem=calcRemaining(selectedThrows);
  if(displayRem<0){
    updateScoreDisplay("bad");
    flash(false,`❌ BUST ${selectedThrows.join(" → ")}`);
    selectedThrows=[];
    setTimeout(()=>nextRound(false),650);
    return;
  }
  if(displayRem===1){
    updateScoreDisplay("bad");
    flash(false,`❌ 残り1 詰み ${selectedThrows.join(" → ")}`);
    selectedThrows=[];
    setTimeout(()=>nextRound(false),650);
    return;
  }

  // v10.10.3: 0になったのに最後がマスターアウトじゃない場合は即ミス
  if(displayRem===0 && !judgeSelectedRoute(selectedThrows)){
    updateScoreDisplay("bad");
    flash(false,`❌ マスターアウト失敗 ${selectedThrows.join(" → ")}`);
    selectedThrows=[];
    setTimeout(()=>nextRound(false),650);
    return;
  }

  updateScoreDisplay();
  flash(true,"入力: "+selectedThrows.join(" → "));
  if(judgeSelectedRoute(selectedThrows)){
    const popular=isPopularRoute(selectedThrows);
    if(popular){bonusTime+=.5; showPerfect("PERFECT!!","王道ルートボーナス -0.5s!!"); playSE("perfect")}
    flash(true,`⭕ ${popular ? "PERFECT！" : "GOOD."} ${selectedThrows.join(" → ")}`);
    selectedThrows=[];
    setTimeout(()=>nextRound(true),560);
    return;
  }
  if(selectedThrows.length<3)return;
  flash(false,`❌ ${selectedThrows.join(" → ")} 不正解`);
  selectedThrows=[];
  setTimeout(()=>nextRound(false),650);
}
function answerNoOut(){
  if(!current)return;
  const ok=answerRoutes.length===0;
  flash(ok,ok?"⭕ 上がれない 正解":"❌ 上がれる");
  setTimeout(()=>nextRound(ok),320);
}
function flash(ok,msg){
  const s=document.getElementById("status");
  s.className="status "+(ok?"good":"bad");
  s.textContent=msg;
  if(!ok)playSE("miss");
}
function nextRound(ok){
  if(!ok)miss++;
  document.getElementById("miss").textContent=miss;
  if(practiceMode){round++; setQuestion(); return}
  if(round>=8 && playing){finishGame(); return}
  if(playing){round++; setQuestion()}
}
function finishGame(){
  playing=false;
  clearInterval(timerId);
  const raw=(performance.now()-startTime)/1000;
  const final=Math.max(0,raw+(miss*5)-bonusTime);
  document.getElementById("finalScore").textContent=final.toFixed(2)+" 秒";
  document.getElementById("detail").textContent=`実時間 ${raw.toFixed(2)}秒 + ミス${miss}個 × 5秒 - 王道ボーナス${bonusTime.toFixed(1)}秒`;
  document.getElementById("resultCard").classList.remove("hide");
  registerRanking(final,raw);
}

});

if("serviceWorker" in navigator && location.protocol!=="file:"){
  navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
}
updateSoundText();
installHoldButtons();
updateInputGuide();
drawBoard();
